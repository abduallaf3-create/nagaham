<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagham</title>
<meta name="theme-color" content="#160b2e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="paused">
<div id="bgimg"></div>
<div id="dyn"></div>
<div id="fx"></div>
<div id="app">
  <aside id="side">
    <div class="card nav">
      <div class="brand"><img src="icon.svg" alt=""><div><b>Nagham</b><small>نغم</small></div></div>
      <a data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg><span>Home</span></a>
      <a data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg><span>Search</span></a>
      <a data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg><span>Your Library</span></a>
      <a data-nav="settings" class="nav-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
    </div>
    <div class="card lib">
      <div class="lib-head">
        <span>Your Library</span>
        <div style="display:flex;gap:2px">
          <button class="icon-btn" id="newPl" title="Create playlist (Ctrl+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="lib-list" id="libList"></div>
    </div>
  </aside>

  <main id="main" class="card">
    <div id="topbar">
      <div class="navpair">
        <button class="round" id="back" title="Go back (Alt+←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="round" id="fwd" title="Go forward (Alt+→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg><input id="q" placeholder="What do you want to listen to?" autocomplete="off" spellcheck="false"><span class="kbd-hint">Ctrl F</span></label>
      <div class="top-right">
        <div id="scanStatus"></div>
        <button class="me-btn" id="meBtn" title="You"></button>
      </div>
    </div>
    <div id="view"></div>
  </main>

  <aside id="queue" class="card">
    <div class="q-head"><span>Queue</span><button class="icon-btn" id="closeQ" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="q-body" id="qBody"></div>
  </aside>

  <footer id="player" class="card">
    <div class="np" id="np"></div>
    <div class="center">
      <div class="ctrls">
        <button class="icon-btn" id="shuffle" title="Shuffle (S)"></button>
        <button class="icon-btn" id="prev" title="Previous (Ctrl+←)"></button>
        <button class="pp" id="pp" title="Play (Space)"></button>
        <button class="icon-btn" id="next" title="Next (Ctrl+→)"></button>
        <button class="icon-btn" id="repeat" title="Repeat (R)"></button>
      </div>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </div>
    <div class="right">
      <button class="icon-btn" id="vidBtn" hidden title="Show the YouTube Music video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="m10.5 9 4 2.5-4 2.5z" fill="currentColor"/><path d="M8 21h8"/></svg></button>
      <button class="icon-btn" id="fullBtn" title="Full-screen player (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="qBtn" title="Queue (Q)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h13M3 12h13M3 18h9M19 14v6M16 17h6"/></svg></button>
      <button class="icon-btn" id="mute" title="Mute (M)"></button>
      <input type="range" id="vol" class="vol" min="0" max="100" value="80">
    </div>
  </footer>
</div>

<div id="full">
  <div class="fbg" id="fbg"></div><div class="fshade"></div>
  <div class="ftop">
    <button class="icon-btn" id="fClose" title="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="fShare" title="Share song code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </div>
  </div>
  <div class="fwrap">
    <div class="fart" id="fArt"></div>
    <div class="finfo">
      <div class="fkind" id="fKind"></div>
      <h1 id="fTitle"></h1>
      <div class="fartist" id="fArtist"></div>
      <div class="seek"><span id="fCur">0:00</span><input type="range" id="fSeek" min="0" max="1000" value="0"><span id="fDur">0:00</span></div>
      <div class="fctrls">
        <button class="icon-btn" id="fShuffle"></button>
        <button class="icon-btn" id="fPrev"></button>
        <button class="pp" id="fPP"></button>
        <button class="icon-btn" id="fNext"></button>
        <button class="icon-btn" id="fRepeat"></button>
        <button class="icon-btn" id="fLike"></button>
        <button class="icon-btn" id="fVid" hidden title="Show the YouTube Music video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="m10.5 9 4 2.5-4 2.5z" fill="currentColor"/><path d="M8 21h8"/></svg></button>
      </div>
      <div class="fnext" id="fNextUp"></div>
    </div>
  </div>
</div>

<div id="ytmini" class="ytmini"><div class="ytbar" title="Drag to move · double-click to reset"><span>⠿ Now playing video</span><div><button class="icon-btn" id="ytSize" title="Change size">▣</button><button class="icon-btn" id="ytExpand" title="Full screen">⤢</button><button class="icon-btn" id="ytHide" title="Hide video (keeps playing)">✕</button></div></div><div id="ytplayer"></div><div id="ytarea"><span>YouTube Music</span></div><div class="ythandle" title="Drag to resize"></div></div>
<div id="onboard"></div>
<audio id="audio" preload="auto"></audio>
<div id="toast"></div>
<script src="core.js"></script>
<script src="themes.js"></script>
<script src="online.js"></script>
<script src="share.js"></script>
<script src="spotify.js"></script>
<script src="youtube.js"></script>
<script src="onboarding.js"></script>
<script src="discord.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
