name: Nagham
options:
  bundleIdPrefix: com.abood
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nagham:
    type: application
    platform: iOS
    sources:
      - path: App
      # Python code (yt-dlp, the bridge) copied into the app as folders: Nagham.app/app and Nagham.app/app_packages
      - path: python/app
        type: folder
        buildPhase: resources
      - path: python/app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: false
    postCompileScripts: []
    postBuildScripts:
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # the app is signed later by SideStore / iloader; Python's modules get a placeholder signature now
          export EXPANDED_CODE_SIGN_IDENTITY="-"
          export EXPANDED_CODE_SIGN_IDENTITY_NAME="ad-hoc"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework app app_packages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abood.nagham
        PRODUCT_NAME: Nagham
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/Nagham-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Core
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)
        HEADER_SEARCH_PATHS: "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: -lnagham -lresolv -framework Security -framework CoreFoundation -framework SystemConfiguration
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ARCHS: arm64
        SUPPORTS_MACCATALYST: NO
