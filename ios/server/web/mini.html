<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagham mini player</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --accent: #a970ff; --bg: #160b2e; --text: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); }
  body { background: var(--bg); }
  #bg { position: fixed; inset: -40px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.5) brightness(.45); transform: scale(1.1); transition: background-image .6s; }
  #bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 55%, transparent), transparent); }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px 16px; }
  .art { width: 86px; height: 86px; flex: none; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.08); box-shadow: 0 10px 28px rgba(0,0,0,.45); cursor: pointer; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art.playing { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .t { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { font-size: 12.5px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .ctrls { display: flex; align-items: center; gap: 4px; }
  button { border: 0; background: none; color: inherit; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; opacity: .85; transition: .15s; }
  button:hover { opacity: 1; background: rgba(255,255,255,.12); }
  button svg { width: 19px; height: 19px; }
  #pp { width: 40px; height: 40px; background: #fff; color: #000; opacity: 1; }
  #pp:hover { transform: scale(1.07); background: #fff; }
  #pp svg { width: 20px; height: 20px; }
  #like.on { color: var(--accent); opacity: 1; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.12); cursor: pointer; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .empty { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <div class="art" id="art" title="Open Nagham"></div>
  <div class="info">
    <div><div class="t" id="t">Nagham</div><div class="a" id="a">Nothing playing</div></div>
    <div class="ctrls">
      <button id="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="pp" title="Play / pause"></button>
      <button id="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button id="like" title="Like"></button>
    </div>
  </div>
</div>
<div class="bar" id="bar"><i id="fill"></i></div>
<script src="mini.js"></script>
</body>
</html>
