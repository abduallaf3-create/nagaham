name: iPhone app

on:
  push:
    branches: [main]
    paths: ["nagham/**", "ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Tools
        run: brew install xcodegen

      - name: Build Nagham.ipa
        id: build
        shell: bash
        run: |
          export BUILD="${{ github.run_number }}"
          ios/build.sh 2>&1 | tee ios/full.log

      - name: Publish (GitHub release + SideStore source)
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -o 'appVersion = "[^"]*"' nagham/update.go | cut -d'"' -f2)"
          TAG="ios-v$VERSION"
          NOTES="$(python3 ios/notes.py "$VERSION")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ios/Nagham.ipa --clobber
          else
            gh release create "$TAG" ios/Nagham.ipa --prerelease --title "Nagham for iPhone $VERSION" --notes "$NOTES"
          fi
          python3 ios/make_source.py "$VERSION" "${{ github.run_number }}" "$(stat -f%z ios/Nagham.ipa)" "$TAG" > ios/source.json
          cat ios/source.json
          git config user.name "nagham-ci"
          git config user.email "nagham-ci@users.noreply.github.com"
          git add ios/source.json
          git commit -m "iPhone app $VERSION (build ${{ github.run_number }}) [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save the build log to the ci-logs branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilog
          cp ios/full.log /tmp/cilog/ 2>/dev/null || true
          if [ -f ios/build.log ]; then grep -E "error|warning: |BUILD|ld:|Undefined|note:" ios/build.log | head -400 > /tmp/cilog/xcode-errors.log; tail -200 ios/build.log > /tmp/cilog/xcode-tail.log; fi
          echo "run ${{ github.run_number }} build=${{ steps.build.outcome }} commit=${{ github.sha }}" > /tmp/cilog/status.txt
          cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          git config user.name "nagham-ci" && git config user.email "nagham-ci@users.noreply.github.com"
          git add -A && git commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
