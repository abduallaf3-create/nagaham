name: Mac app

on:
  push:
    branches: [main]
    paths: ["mac/**", "nagham/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build Nagham.app
        shell: bash
        run: BUILD="${{ github.run_number }}" mac/build.sh 2>&1 | tee mac/build.log

      - name: Try it on this Mac (open the app, check the server, the downloader and a screenshot)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -x
          mkdir -p mac/check
          D="$HOME/Library/Application Support/Nagham"
          open mac/build/Nagham.app
          for i in $(seq 1 60); do [ -s "$D/port" ] && break; sleep 1; done
          PORT="$(cat "$D/port")"; B="http://127.0.0.1:$PORT"
          echo "port $PORT"
          sleep 12
          screencapture -x mac/check/1-start.png || true
          curl -s "$B/api/ytm" -X POST -d '{}' | tee mac/check/native.json; echo
          curl -s -m 30 "$B/api/dl/search?q=adele%20hello" | head -c 600 | tee mac/check/search.json; echo
          # one real download (the first time also gets yt-dlp, ffmpeg and deno for Mac)
          JOB="$(curl -s -X POST "$B/api/dl/start" -H 'Content-Type: application/json' -d '{"url":"https://www.youtube.com/watch?v=YQHsXMglC9A","format":"m4a"}')"
          echo "$JOB" | tee mac/check/job-start.json
          ID="$(echo "$JOB" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' || true)"
          for i in $(seq 1 120); do
            S="$(curl -s "$B/api/dl/job?id=$ID")"; echo "$S" | head -c 300; echo
            echo "$S" | grep -q '"status":"\(done\|error\)"' && break
            sleep 3
          done
          echo "$S" > mac/check/job-end.json
          ls -la "$D/tools" | tee mac/check/tools.txt || true
          "$D/tools/ffmpeg" -version 2>&1 | head -1 | tee -a mac/check/tools.txt || true
          "$D/tools/yt-dlp" --version 2>&1 | tee -a mac/check/tools.txt || true
          screencapture -x mac/check/2-after.png || true
          cp "$D/nagham.log" mac/check/ 2>/dev/null || true
          osascript -e 'quit app "Nagham"' || true
          sleep 3; pgrep -fl nagham-server | tee mac/check/after-quit.txt || echo "server stopped" | tee mac/check/after-quit.txt

      - name: Try the Mac self-update (a pretend newer release, served on this Mac)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -x
          mkdir -p mac/check /tmp/rel/repos/abduallaf3-create/nagaham/releases
          D="$HOME/Library/Application Support/Nagham"
          ZIP="$(ls mac/build/Nagham-mac-*.zip | head -1)"
          cp "$ZIP" /tmp/rel/Nagham-mac-9.9.9.zip
          SIZE=$(stat -f %z /tmp/rel/Nagham-mac-9.9.9.zip)
          cat > /tmp/rel/repos/abduallaf3-create/nagaham/releases/latest <<JSON
          {"tag_name":"v9.9.9","name":"test","body":"test","html_url":"x","assets":[{"name":"Nagham-mac-9.9.9.zip","browser_download_url":"http://127.0.0.1:8765/Nagham-mac-9.9.9.zip","size":$SIZE}]}
          JSON
          (cd /tmp/rel && python3 -m http.server 8765 >/tmp/rel.log 2>&1 &)
          rm -rf /Applications/Nagham.app && ditto -x -k "$ZIP" /Applications/
          BEFORE=$(stat -f %i /Applications/Nagham.app)
          rm -f "$D/port"
          open --env NAGHAM_GH_API=http://127.0.0.1:8765 --env NAGHAM_TEST_DLHOST=127.0.0.1:8765 /Applications/Nagham.app
          for i in $(seq 1 60); do [ -s "$D/port" ] && break; sleep 1; done
          B="http://127.0.0.1:$(cat "$D/port")"
          curl -s -m 5 http://127.0.0.1:8765/repos/abduallaf3-create/nagaham/releases/latest | head -c 200 | tee mac/check/update-fake.txt; echo
          ps eww -p "$(pgrep -f 'MacOS/nagham-server' | head -1)" | tr ' ' '\n' | grep NAGHAM | tee -a mac/check/update-fake.txt
          cat /tmp/rel.log | tee -a mac/check/update-fake.txt
          curl -s "$B/api/update/check" | tee mac/check/update-check.json; echo
          rm -f "$D/port"
          curl -s -X POST "$B/api/update/install" | tee mac/check/update-install.json; echo
          for i in $(seq 1 60); do [ -s "$D/port" ] && break; sleep 1; done
          sleep 3
          AFTER=$(stat -f %i /Applications/Nagham.app)
          { echo "app folder before=$BEFORE after=$AFTER"; [ "$BEFORE" != "$AFTER" ] && echo "SWAPPED" || echo "NOT swapped";
            [ -s "$D/port" ] && echo "new Nagham running on port $(cat "$D/port")" || echo "Nagham did NOT come back";
            ls /Applications | grep -i nagham; pgrep -fl "Nagham.app/Contents/MacOS" ; tail -5 "$D/update.log" 2>/dev/null; } | tee mac/check/update-result.txt
          screencapture -x mac/check/3-after-update.png || true
          osascript -e 'quit app "Nagham"' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nagham-mac
          path: |
            mac/build/Nagham-mac-*.zip
            mac/build.log
            mac/check/
          if-no-files-found: warn

      - name: Keep the app and the check on the mac-build branch (no release)
        if: always()
        shell: bash
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp mac/build/Nagham-mac-*.zip /tmp/out/ 2>/dev/null || true
          cp -R mac/check /tmp/out/check 2>/dev/null || true
          cp mac/build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b mac-build
          git config user.name "Nagham build"; git config user.email "noreply@github.com"
          git add -A && git commit -q -m "Mac build ${{ github.run_number }} [skip ci]"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mac-build
